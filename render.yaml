services:
  - type: web
    name: conceptifyyy-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: conceptifyyy-store-data
      mountPath: /var/data/store
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://new-project-gnar.onrender.com
      - key: STORE_DATA_PATH
        value: /var/data/store
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://waacxgunczcbbapsxbay.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_v0FP8o0WFiNYgHMCVR_n-g_dv-jJS6v
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        value: https://waacxgunczcbbapsxbay.supabase.co/auth/v1/.well-known/jwks.json
      - key: MONGODB_URI
        sync: false

  - type: static
    name: conceptifyyy-frontend
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
